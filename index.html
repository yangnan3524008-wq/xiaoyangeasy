<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小羊不难作品集 | Fashion Portfolio</title>
    <style>
        /* 全局重置与基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* 导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        .nav-links li { display: inline-block; margin-left: 30px; }
        .nav-links a:hover { color: #aaa; }

        /* 首屏海报区域 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://picsum.photos/1920/1080?grayscale') no-repeat center/cover;
        }
        .hero h1 { font-size: 4rem; margin-bottom: 20px; letter-spacing: 5px; }
        .hero p { font-size: 1.2rem; margin-bottom: 40px; color: #ddd; }
        .btn {
            padding: 15px 40px;
            border: 1px solid #fff;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:hover { background: #fff; color: #000; }

        /* 作品展示网格 */
        .gallery { padding: 80px 5%; }
        .gallery h2 { text-align: center; margin-bottom: 60px; font-size: 2rem; letter-spacing: 3px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            position: relative;
            overflow: hidden;
            height: 400px;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover img { transform: scale(1.1); }
        .card-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #333;
            color: #666;
            font-size: 0.9rem;
        }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { display: none; } /* 简化处理，实际可加汉堡菜单 */
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="logo">FASHION.</div>
        <ul class="nav-links">
            <li><a href="#">首页</a></li>
            <li><a href="#">作品集</a></li>
            <li><a href="#">关于</a></li>
            <li><a href="#">联系</a></li>
        </ul>
    </nav>

    <!-- 首屏海报 -->
    <section class="hero">
        <h1>定义你的风格</h1>
        <p>小羊在路上</p>
        <a href="#" class="btn">查看作品</a>
    </section>

    <!-- 作品展示 -->
    <section class="gallery">
        <h2>精选作品</h2>
        <div class="grid">
            <div class="card">
                <img src="https://picsum.photos/400/600?random=1" alt="时尚作品1">
                <div class="card-info"><h3>视频剪辑</h3></div>
            </div>
            <div class="card">
                <img src="https://picsum.photos/400/600?random=2" alt="时尚作品2">
                <div class="card-info"><h3>视频拍摄</h3></div>
            </div>
            <div class="card">
                <img src="https://picsum.photos/400/600?random=3" alt="时尚作品3">
                <div class="card-info"><h3>平面设计</h3></div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2024 FASHION PORTFOLIO. All Rights Reserved.</p>
    </footer>
</body>
</html>
